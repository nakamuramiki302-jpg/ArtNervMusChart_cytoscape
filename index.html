<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
      <meta charset="UTF-8">
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Anatomy Learning App</title>
      <meta name="description"
            content="Interactive anatomy learning application with search and neighbor visualization">
      <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
      <meta name="format-detection" content="telephone=no">
      <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->
      <link rel="stylesheet" href="styles/dc4be20e.vendor.css">
      <link rel="stylesheet" href="styles/dcab8a36.main.css">
      <link rel="stylesheet" href="styles/anatomy-search.css">
</head>

<body ng-app="cyViewerApp">
      <!--[if lt IE 7]>
      <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please
          <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
    <![endif]-->

      <!-- Add your site or application content here -->
      <div class="main" ng-view=""></div>

      <!--[if lt IE 9]>
    <script src="bower_components/es5-shim/es5-shim.js"></script>
    <script src="bower_components/json3/lib/json3.min.js"></script>
    <![endif]-->

      <script type="text/ng-template" id="main.html">
        <div ng-controller="MainCtrl">
        <div id="network" ng-style="{'background-color': bg.color}" style="background-color: #000000 !important;"></div>
        <div class="loading"><span us-spinner="{radius:30, width:3, length: 100}"></span></div>
        
        <!-- Search Panel -->
        <div class="search-panel" id="draggable-search-panel" style="width: 240px !important; cursor: move;">
            <button type="button" class="close-search-btn" onclick="toggleSearchPanel()" style="position: absolute; top: 5px; right: 5px; background: none; border: none; font-size: 16px; cursor: pointer; color: #666; padding: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; z-index: 10;">×</button>
            <div class="search-container" style="display: flex !important; flex-direction: column !important; gap: 8px;">
                <input type="text" id="search-input" ng-model="searchQuery" placeholder="search anatomy terms" class="form-control search-input" onkeydown="if(event.keyCode===13) directSearch()" style="width: 100% !important; box-sizing: border-box;">
                <div class="button-row" style="display: flex !important; gap: 8px; width: 100%;">
                    <button type="button" class="btn btn-primary search-btn" onclick="directSearch()" style="flex: 1 !important; box-sizing: border-box;">Search</button>
                    <button type="button" class="btn btn-secondary clear-btn" onclick="directClear()" style="flex: 1 !important; box-sizing: border-box;">Clear</button>
                </div>
            </div>
            <div class="search-results" ng-show="searchResults.length > 0">
                <h4>Search Results ({{searchResults.length}} items)</h4>
                <ul class="list-group">
                    <li class="list-group-item" ng-repeat="result in searchResults" ng-class="{'selected-item': result.selected}" onclick="handleSearchResultClick(this)" ontouchend="handleSearchResultClick(this)" data-result-id="{{result.id}}" data-result-name="{{result.name}}" data-result-index="{{$index}}" style="cursor: pointer; -webkit-tap-highlight-color: rgba(0,0,0,0.1); user-select: none;">
                        {{result.name}} <span class="badge {{result.anatomyType || result.type}}">{{result.anatomyType || result.type}}</span>
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- フローティング検索ボタン（検索パネルが非表示の時に表示） -->
        <div class="floating-search-btn" id="floating-search-btn" onclick="toggleSearchPanel()" style="display: none; position: fixed; top: 20px; left: 20px; width: 50px; height: 50px; background: #007bff; color: white; border: none; border-radius: 50%; cursor: pointer; z-index: 1002; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-size: 20px; align-items: center; justify-content: center;">
            🔍
        </div>
        
        <!-- フローティング隣接構造ボタン（隣接パネルが非表示で隣接データがある時に表示） -->
        <div class="floating-neighbors-btn" id="floating-neighbors-btn" onclick="toggleNeighborsPanel()" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: #28a745; color: white; border: none; border-radius: 50%; cursor: pointer; z-index: 1002; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-size: 16px; align-items: center; justify-content: center;">
            🔗
        </div>
        
        <!-- Neighbors Panel -->
        <div class="neighbors-panel" id="neighbors-panel" ng-show="selectedNodeNeighbors.length > 0">
            <button type="button" class="close-neighbors-btn" onclick="toggleNeighborsPanel()" style="position: absolute; top: 5px; right: 5px; background: none; border: none; font-size: 16px; cursor: pointer; color: #666; padding: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; z-index: 10;">×</button>
            <ul class="list-group">
                <li class="list-group-item" ng-repeat="neighbor in selectedNodeNeighbors" ng-class="{'selected-item': neighbor.selected}" ng-click="selectNeighborFromList(neighbor.id, neighbor.name, $index)" onclick="window.directSelectNeighbor(this.getAttribute('data-neighbor-id'), this.getAttribute('data-neighbor-name'), this.getAttribute('data-neighbor-index'))" data-neighbor-id="{{neighbor.id}}" data-neighbor-name="{{neighbor.name}}" data-neighbor-index="{{$index}}" style="cursor: pointer;">
                    {{neighbor.name}} <span class="badge {{neighbor.anatomyType || neighbor.type}}">{{neighbor.anatomyType || neighbor.type}}</span>
                </li>
            </ul>
        </div>
        

        <div class="summary" ng-show="overlayState.show">
            <h3>Network:</h3>
            <select class="form-control" id="network-selector" ng-options="networkName for networkName in networkNames" ng-change="switchNetwork()" ng-model="currentNetwork"></select>
            <h3>Visual Style:</h3>
            <select class="form-control" id="vs-selector" ng-options="styleName for styleName in visualStyleNames" ng-change="switchVS()" ng-model="currentVS"></select>
            <h3>Layout:</h3>
            <select class="form-control" id="layout-selector" ng-options="layoutName for layoutName in LAYOUTS" ng-change="switchLayout()" ng-model="currentLayout"></select>
        </div>
        
        <div ng-show="browserState.show" class="table-browser">
            <div id="table-view">
                <tabset justified="true">
                    <tab heading="Node">
                        <table class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <td>SUID</td>
                                    <td ng-repeat="columnName in columnNames">{{columnName}}</td>
                                </tr>
                            </thead>
                            <tbody data-ng-repeat="node in selectedNodes">
                                <tr>
                                    <td>{{ node.id() }}</td>
                                    <td ng-repeat="colName in columnNames">{{node.data(colName)}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </tab>
                    <tab heading="Edge">
                        <table class="table table-striped table-bordered table-hover">
                            <thead>
                                <tr>
                                    <td>SUID</td>
                                    <td ng-repeat="columnName in edgeColumnNames">{{columnName}}</td>
                                </tr>
                            </thead>
                            <tbody data-ng-repeat="edge in selectedEdges">
                                <tr>
                                    <td>{{ edge.id() }}</td>
                                    <td ng-repeat="colName in edgeColumnNames">{{edge.data(colName)}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </tab>
                </tabset>
            </div>
        </div>
        
        <div class="home-button" ng-click="toggleToolbar()" style="clear:both" tooltip-placement="left" tooltip="Show/Hide Toolbar">
            <span class="glyphicon glyphicon-sort"></span>
        </div>
        
        <div class="command-bar" ng-show="toolbarState.show">
            <div class="icon-button" ng-click="toggleTableBrowser()" tooltip-placement="left" tooltip="Show/Hide Table">
                <span class="glyphicon glyphicon-list-alt"></span>
            </div>
            <div class="icon-button" ng-click="toggleOverlay()" tooltip-placement="left" tooltip="Show/Hide Selector">
                <span class="glyphicon glyphicon-info-sign"></span>
            </div>
            <div class="icon-button" ng-click="fit()" tooltip-placement="left" tooltip="Fit to window">
                <span class="glyphicon glyphicon-resize-full"></span>
            </div>
            <div class="icon-button" colorpicker="" colorpicker-position="left" ng-model="bg.color" tooltip-placement="left" tooltip="Set Background Color">
                <span class="glyphicon glyphicon-tint"></span>
            </div>
        </div>
        </div>
    </script>

      <script src="data/networks.js"></script>
      <script src="data/styles.js"></script>
      <script src="data/translation-dictionary.js"></script>

      <script src="scripts/65d77273.vendor.js"></script>
      <script src="scripts/1d327552.scripts.js"></script>
      <script src="scripts/custom.js"></script>
      <script src="scripts/anatomy-fix.js"></script>

      <script>
            // 直接検索関数
            function directSearch() {
                  console.log('=== 直接検索実行 ===');

                  const searchInput = document.getElementById('search-input');
                  const query = searchInput.value;

                  console.log('検索クエリ:', query);

                  if (!query || query.trim() === '') {
                        console.log('検索クエリが空です');
                        updateSearchResults([]);
                        return;
                  }

                  // Cytoscapeインスタンスを取得
                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeインスタンスが見つかりません');
                        return;
                  }

                  console.log('Cytoscapeノード数:', cy.nodes().length);

                  const results = [];
                  const searchTerm = query.toLowerCase().trim();

                  // 翻訳機能があれば使用
                  let translatedTerm = searchTerm;
                  if (typeof translateToEnglish === 'function') {
                        try {
                              translatedTerm = translateToEnglish(query).toLowerCase().trim();
                              console.log('翻訳:', query, '->', translatedTerm);
                        } catch (e) {
                              console.log('翻訳エラー:', e);
                        }
                  }

                  cy.nodes().forEach(function (node) {
                        const name = (node.data('name') || '').toLowerCase();
                        const sharedName = (node.data('shared_name') || '').toLowerCase();

                        if (name.includes(searchTerm) || name.includes(translatedTerm) ||
                              sharedName.includes(searchTerm) || sharedName.includes(translatedTerm)) {

                              const result = {
                                    id: node.id(),
                                    name: node.data('name') || node.data('shared_name'),
                                    type: node.data('P2attr') || node.data('P1attr') || 'unknown',
                                    selected: false
                              };

                              // 解剖学的タイプを判定して追加
                              const anatomyType = getNodeTypeFromData(node.data());
                              result.anatomyType = anatomyType;

                              results.push(result);
                              console.log('検索結果追加:', result);
                        }
                  });

                  console.log('検索完了:', results.length, '件');
                  updateSearchResults(results);
            }

            // 検索結果を更新
            function updateSearchResults(results) {
                  try {
                        const scope = angular.element(document.body).scope();
                        if (scope) {
                              scope.$apply(function () {
                                    scope.searchResults = results;
                              });
                              console.log('AngularJSスコープ更新完了');
                        } else {
                              console.error('AngularJSスコープが見つかりません');
                        }
                  } catch (e) {
                        console.error('スコープ更新エラー:', e);
                  }
            }

            // 直接クリア関数
            function directClear() {
                  console.log('=== 直接クリア実行 ===');

                  const searchInput = document.getElementById('search-input');
                  searchInput.value = '';

                  // Cytoscapeの解剖学レイアウトを再適用
                  const cy = window.cy;
                  if (cy) {
                        // 全ノードのロックを解除
                        cy.nodes().unlock();

                        // 全ノードとエッジを再表示
                        cy.nodes().style({
                              'opacity': 1,
                              'display': 'element'
                        });
                        cy.edges().style({
                              'opacity': 0.4,
                              'display': 'element',
                              'width': '0.3px',
                              'line-color': '#F0F0F0'
                        });
                        applyAnatomyLayout();
                        cy.nodes().unselect();
                        setTimeout(function () {
                              cy.fit(cy.nodes(), 50);
                        }, 200);
                  }

                  // 保存された選択データをクリア
                  currentSelectedNode = null;
                  currentSelectedNodeNeighbors = [];

                  // AngularJSスコープをクリア
                  try {
                        const scope = angular.element(document.body).scope();
                        if (scope) {
                              scope.$apply(function () {
                                    scope.searchQuery = '';
                                    scope.searchResults = [];
                                    scope.selectedNodeNeighbors = [];
                              });
                        }
                  } catch (e) {
                        console.error('クリア時のスコープ更新エラー:', e);
                  }

                  console.log('クリア完了');
                  
                  // フローティングボタンの状態を更新
                  updateFloatingNeighborsButton();
            }

            // 検索結果選択関数
            function selectSearchResult(resultId, resultName, resultIndex) {
                  console.log('=== 検索結果選択 ===');
                  console.log('ID:', resultId);
                  console.log('Name:', resultName);
                  console.log('Index:', resultIndex);

                  if (!resultId || !resultName) {
                        console.error('無効なパラメータ:', { resultId, resultName, resultIndex });
                        return;
                  }

                  // 検索結果の選択状態を更新
                  try {
                        const scope = angular.element(document.body).scope();
                        if (scope && scope.searchResults) {
                              scope.$apply(function () {
                                    // 全ての検索結果の選択状態をクリア
                                    scope.searchResults.forEach(function (item) {
                                          item.selected = false;
                                    });
                                    // 選択されたアイテムをハイライト
                                    const index = parseInt(resultIndex);
                                    if (scope.searchResults[index]) {
                                          scope.searchResults[index].selected = true;
                                    }
                              });
                              console.log('検索結果選択状態更新完了');
                        }
                  } catch (e) {
                        console.error('検索結果選択状態更新エラー:', e);
                  }

                  // ノードをハイライト
                  highlightSelectedNode(resultId, resultName);
            }

            // 隣接ノード選択関数（新しい中心として設定）
            function selectNeighborNode(neighborId, neighborName, neighborIndex) {
                  console.log('=== 隣接ノード選択（新しい中心として） ===');
                  console.log('ID:', neighborId);
                  console.log('Name:', neighborName);
                  console.log('Index:', neighborIndex);

                  if (!neighborId || !neighborName) {
                        console.error('無効なパラメータ:', { neighborId, neighborName, neighborIndex });
                        return;
                  }

                  // 隣接ノードの選択状態を更新
                  try {
                        const scope = angular.element(document.body).scope();
                        if (scope && scope.selectedNodeNeighbors) {
                              scope.$apply(function () {
                                    // 全ての隣接ノードの選択状態をクリア
                                    scope.selectedNodeNeighbors.forEach(function (item) {
                                          item.selected = false;
                                    });
                                    // 選択されたアイテムをハイライト
                                    const index = parseInt(neighborIndex);
                                    if (scope.selectedNodeNeighbors[index]) {
                                          scope.selectedNodeNeighbors[index].selected = true;
                                    }
                              });
                              console.log('隣接ノード選択状態更新完了');
                        }
                  } catch (e) {
                        console.error('隣接ノード選択状態更新エラー:', e);
                  }

                  // 選択されたneighborを新しい中心としてハイライト（フォーカスモード）
                  console.log('neighborを新しい中心として設定:', neighborName);
                  console.log('highlightSelectedNode呼び出し前 - ID:', neighborId, 'Name:', neighborName);

                  // 少し遅延を入れてUI更新を確実にする
                  setTimeout(function () {
                        console.log('highlightSelectedNode実行中...');
                        highlightSelectedNode(neighborId, neighborName);
                        console.log('highlightSelectedNode完了');
                  }, 100);
            }

            // 色盲対応の色パレット定義
            const anatomyColors = {
                  // 筋肉系 - 薄ピンク色（色盲対応）
                  muscle: {
                        background: '#F8BBD9',  // 薄いピンク
                        border: '#E91E63',      // 濃いピンク
                        highlight: '#FCE4EC'    // 非常に薄いピンク
                  },
                  // 動脈系 - 赤色（色盲対応）
                  artery: {
                        background: '#FFCDD2',  // 薄い赤
                        border: '#D32F2F',      // 濃い赤
                        highlight: '#FFEBEE'    // 非常に薄い赤
                  },
                  // 神経系 - 緑色（色盲対応）
                  nerve: {
                        background: '#C8E6C9',  // 薄い緑
                        border: '#388E3C',      // 濃い緑
                        highlight: '#E8F5E9'    // 非常に薄い緑
                  },
                  // 関節・骨格系 - 青色（色盲対応）
                  joint: {
                        background: '#BBDEFB',  // 薄い青
                        border: '#1976D2',      // 濃い青
                        highlight: '#E3F2FD'    // 非常に薄い青
                  },
                  // その他 - グレー
                  unknown: {
                        background: '#E0E0E0',  // 薄いグレー
                        border: '#616161',      // 濃いグレー
                        highlight: '#F5F5F5'    // 非常に薄いグレー
                  },
                  // ハイライト色 - 黄色（色盲対応）
                  highlight: {
                        background: '#FFF59D',  // 薄い黄色
                        border: '#F57F17',      // 濃い黄色（オレンジ寄り）
                        glow: 'rgba(255, 193, 7, 0.8)'  // 黄色のグロー効果
                  }
            };

            // ノードタイプを判定する関数（Cytoscapeノード用）
            function getNodeType(node) {
                  return getNodeTypeFromData(node.data());
            }

            // ノードデータからタイプを判定する関数（改良版）
            function getNodeTypeFromData(nodeData) {
                  const type1 = (nodeData.P1attr || '').toLowerCase();
                  const type2 = (nodeData.P2attr || '').toLowerCase();
                  const name = (nodeData.name || '').toLowerCase();
                  const sharedName = (nodeData.shared_name || '').toLowerCase();

                  // デバッグ出力
                  console.log('ノードタイプ判定:', {
                        name: name,
                        sharedName: sharedName,
                        P1attr: type1,
                        P2attr: type2
                  });

                  // 動脈系の判定（aortaを優先的に判定）
                  if (type1.includes('artery') || type2.includes('artery') ||
                        name.includes('artery') || sharedName.includes('artery') ||
                        name.includes('aorta') || sharedName.includes('aorta') ||
                        name.includes('aortic') || sharedName.includes('aortic') ||
                        type1.includes('aorta') || type2.includes('aorta')) {
                        console.log('→ 動脈系として判定');
                        return 'artery';
                  }

                  // 筋肉系の判定
                  if (type1.includes('muscle') || type2.includes('muscle') ||
                        name.includes('muscle') || sharedName.includes('muscle') ||
                        name.includes('sphincter') || sharedName.includes('sphincter')) {
                        console.log('→ 筋肉系として判定');
                        return 'muscle';
                  }

                  // 神経系の判定
                  if (type1.includes('nerve') || type2.includes('nerve') ||
                        name.includes('nerve') || sharedName.includes('nerve') ||
                        name.includes('neural') || sharedName.includes('neural')) {
                        console.log('→ 神経系として判定');
                        return 'nerve';
                  }

                  // 関節・骨格系の判定
                  if (type1.includes('joint') || type2.includes('joint') ||
                        name.includes('joint') || sharedName.includes('joint') ||
                        name.includes('bone') || sharedName.includes('bone')) {
                        console.log('→ 関節・骨格系として判定');
                        return 'joint';
                  }

                  console.log('→ 不明として判定');
                  return 'unknown';
            }

            // テキストを短縮する関数
            function truncateText(text, maxLength) {
                  if (!text) return '';
                  if (text.length <= maxLength) return text;

                  // 単語の境界で切る
                  const words = text.split(' ');
                  let result = '';

                  for (let word of words) {
                        if ((result + word).length <= maxLength) {
                              result += (result ? ' ' : '') + word;
                        } else {
                              break;
                        }
                  }

                  return result || text.substring(0, maxLength - 1) + '…';
            }

            // 現在選択されているノードを記録する変数
            let currentSelectedNode = null;
            let currentSelectedNodeNeighbors = [];

            // 隣接ノードパネルの状態を復元する関数
            function restoreNeighborsPanel() {
                  console.log('=== 隣接ノードパネル状態復元 ===');
                  
                  if (currentSelectedNodeNeighbors && currentSelectedNodeNeighbors.length > 0) {
                        try {
                              const scope = angular.element(document.body).scope();
                              if (scope) {
                                    scope.$apply(function () {
                                          scope.selectedNodeNeighbors = currentSelectedNodeNeighbors;
                                    });
                                    
                                    const neighborsPanel = document.getElementById('neighbors-panel');
                                    if (neighborsPanel) {
                                          neighborsPanel.style.display = 'block';
                                          console.log('隣接ノードパネルの状態を復元しました:', currentSelectedNodeNeighbors.length, '件');
                                    }
                              }
                        } catch (e) {
                              console.error('隣接ノードパネル復元エラー:', e);
                        }
                  } else {
                        console.log('復元する隣接ノードデータがありません');
                  }
            }

            // 全ノードに色を適用する関数
            function applyAnatomyColors() {
                  console.log('=== 解剖学的色分け適用 ===');

                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeインスタンスが見つかりません');
                        return;
                  }

                  let colorCounts = { muscle: 0, artery: 0, nerve: 0, joint: 0, unknown: 0 };

                  // ノードのスタイル適用
                  cy.nodes().forEach(function (node) {
                        const nodeType = getNodeType(node);
                        const colors = anatomyColors[nodeType];

                        colorCounts[nodeType]++;

                        node.style({
                              'background-color': colors.background,
                              'border-color': colors.border,
                              'border-width': '2px',
                              'width': '16px',
                              'height': '16px'
                        });
                  });

                  // エッジのスタイル適用
                  cy.edges().forEach(function (edge) {
                        edge.style({
                              'width': '0.3px', // 極細の線
                              'line-color': '#F0F0F0', // 非常に薄いグレー
                              'target-arrow-shape': 'none', // 矢印なし
                              'source-arrow-shape': 'none', // 矢印なし
                              'opacity': 0.4, // より透明に
                              'curve-style': 'straight' // 直線
                        });
                  });

                  // 全ノードに共通のテキストスタイルを適用
                  cy.nodes().forEach(function (node) {
                        const originalText = node.data('name') || node.data('shared_name') || '';
                        const shortText = truncateText(originalText, 8); // 8文字まで

                        node.style({
                              'label': shortText,
                              'font-size': '6px', // 全体表示時は小さなフォント
                              'color': '#333',
                              'text-valign': 'center',
                              'text-halign': 'center',
                              'text-wrap': 'wrap',
                              'text-max-width': '14px', // ノード幅に収まるサイズ
                              'text-opacity': 1,

                  // 超強力な円状配置アルゴリズム

                  // 動的半径計算（スマホでは大きく）

            // カスタム形状レイアウト関数
            function createAnatomyShapeLayout() {
                  console.log('=== 解剖学的形状レイアウト作成 ===');

                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeインスタンスが見つかりません');
                        return;
                  }

                  // ノードを解剖学的タイプ別に分類
                  const nodesByType = {
                        artery: [],
                        muscle: [],
                        nerve: [],
                        joint: [],
                        unknown: []
                  };

                  cy.nodes().forEach(function (node) {
                        const nodeType = getNodeType(node);
                        nodesByType[nodeType].push(node);
                  });

                  console.log('ノード分類:', {
                        artery: nodesByType.artery.length,
                        muscle: nodesByType.muscle.length,
                        nerve: nodesByType.nerve.length,
                        joint: nodesByType.joint.length,
                        unknown: nodesByType.unknown.length
                  });

                  // レイアウト設定
                  const canvasWidth = cy.width();
                  const canvasHeight = cy.height();
                  const sectionWidth = canvasWidth / 5; // 5つのセクション（artery, muscle, nerve, joint, unknown）
                  const centerY = canvasHeight / 2;

                  // 動脈 - ハート型配置（左端）
                  arrangeInHeartShape(nodesByType.artery, sectionWidth * 0.5, centerY, sectionWidth * 1.0);

                  // 筋肉 - ラグビーボール型配置
                  arrangeInRugbyBallShape(nodesByType.muscle, sectionWidth * 1.5, centerY, sectionWidth * 0.8);

                  // 神経 - 三角形配置
                  arrangeInTriangleShape(nodesByType.nerve, sectionWidth * 2.5, centerY, sectionWidth * 0.8);

                  // 関節 - 円形配置
                  arrangeInCircleShape(nodesByType.joint, sectionWidth * 3.5, centerY, sectionWidth * 0.8);

                  // その他 - グリッド配置
                  arrangeInGridShape(nodesByType.unknown, sectionWidth * 4.5, centerY, sectionWidth * 0.8);

                  console.log('解剖学的形状レイアウト完了');
            }

            // ハート型配置関数
            function arrangeInHeartShape(nodes, centerX, centerY, maxWidth) {
                  if (nodes.length === 0) return;

                  const scale = Math.min(maxWidth / 80, 3.5);

                  nodes.forEach(function (node, index) {
                        const t = (index / Math.max(nodes.length - 1, 1)) * 2 * Math.PI;

                        // ハート型の数式: x = 20sin³(t), y = 16cos(t) - 6cos(2t) - 3cos(3t) - cos(4t)
                        const x = 20 * Math.pow(Math.sin(t), 3) * scale;
                        const y = -(16 * Math.cos(t) - 6 * Math.cos(2 * t) - 3 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

                        node.position({
                              x: centerX + x,
                              y: centerY + y
                        });
                  });
            }

            // ラグビーボール型配置関数
            function arrangeInRugbyBallShape(nodes, centerX, centerY, maxWidth) {
                  if (nodes.length === 0) return;

                  const scale = Math.min(maxWidth / 120, 2);
                  const a = 80 * scale; // 長軸
                  const b = 40 * scale; // 短軸

                  nodes.forEach(function (node, index) {
                        const t = (index / Math.max(nodes.length - 1, 1)) * 2 * Math.PI;

                        // 楕円形（ラグビーボール型）
                        const x = a * Math.cos(t);
                        const y = b * Math.sin(t);

                        node.position({
                              x: centerX + x,
                              y: centerY + y
                        });
                  });
            }

            // 三角形配置関数
            function arrangeInTriangleShape(nodes, centerX, centerY, maxWidth) {
                  if (nodes.length === 0) return;

                  const scale = Math.min(maxWidth / 100, 2.8);
                  const triangleSize = 90 * scale; // 三角形のサイズ

                  // 正三角形の頂点を計算
                  const vertex1 = { x: 0, y: -triangleSize * 0.65 }; // 上の頂点
                  const vertex2 = { x: -triangleSize * 0.55, y: triangleSize * 0.35 }; // 左下の頂点
                  const vertex3 = { x: triangleSize * 0.55, y: triangleSize * 0.35 }; // 右下の頂点

                  nodes.forEach(function (node, index) {
                        let x, y;

                        if (nodes.length <= 3) {
                              // ノードが3個以下の場合は頂点に配置
                              const vertices = [vertex1, vertex2, vertex3];
                              const vertex = vertices[index % 3];
                              x = vertex.x;
                              y = vertex.y;
                        } else if (nodes.length <= 12) {
                              // ノードが12個以下の場合は辺に沿って配置
                              const progress = (index / Math.max(nodes.length - 1, 1)) * 3;

                              if (progress <= 1) {
                                    // 上の頂点から左下の頂点への辺
                                    const ratio = progress;
                                    x = vertex1.x + (vertex2.x - vertex1.x) * ratio;
                                    y = vertex1.y + (vertex2.y - vertex1.y) * ratio;
                              } else if (progress <= 2) {
                                    // 左下の頂点から右下の頂点への辺
                                    const ratio = progress - 1;
                                    x = vertex2.x + (vertex3.x - vertex2.x) * ratio;
                                    y = vertex2.y + (vertex3.y - vertex2.y) * ratio;
                              } else {
                                    // 右下の頂点から上の頂点への辺
                                    const ratio = progress - 2;
                                    x = vertex3.x + (vertex1.x - vertex3.x) * ratio;
                                    y = vertex3.y + (vertex1.y - vertex3.y) * ratio;
                              }
                        } else {
                              // ノードが多い場合は三角形内部にも配置
                              const angle = (index / nodes.length) * 2 * Math.PI;
                              const layer = Math.floor(index / 6) + 1; // レイヤー（内側から外側へ）
                              const radius = (triangleSize * 0.3 * layer) / Math.max(Math.floor(nodes.length / 6), 1);

                              x = radius * Math.cos(angle);
                              y = radius * Math.sin(angle);

                              // 三角形の境界内に収める
                              const maxRadius = triangleSize * 0.4;
                              if (Math.sqrt(x * x + y * y) > maxRadius) {
                                    const factor = maxRadius / Math.sqrt(x * x + y * y);
                                    x *= factor;
                                    y *= factor;
                              }
                        }

                        node.position({
                              x: centerX + x,
                              y: centerY + y
                        });
                  });
            }

            // 円形配置関数
            function arrangeInCircleShape(nodes, centerX, centerY, maxWidth) {
                  if (nodes.length === 0) return;

                  const radius = Math.min(maxWidth / 2.5, 120);

                  nodes.forEach(function (node, index) {
                        const angle = (index / Math.max(nodes.length - 1, 1)) * 2 * Math.PI;
                        const x = radius * Math.cos(angle);
                        const y = radius * Math.sin(angle);

                        node.position({
                              x: centerX + x,
                              y: centerY + y
                        });
                  });
            }

            // グリッド配置関数
            function arrangeInGridShape(nodes, centerX, centerY, maxWidth) {
                  if (nodes.length === 0) return;

                  const cols = Math.ceil(Math.sqrt(nodes.length));
                  const rows = Math.ceil(nodes.length / cols);
                  const spacing = Math.min(maxWidth / cols, 40);

                  nodes.forEach(function (node, index) {
                        const col = index % cols;
                        const row = Math.floor(index / cols);

                        const x = (col - (cols - 1) / 2) * spacing;
                        const y = (row - (rows - 1) / 2) * spacing;

                        node.position({
                              x: centerX + x,
                              y: centerY + y
                        });
                  });
            }

            // レイアウト適用関数
            function applyAnatomyLayout() {
                  console.log('=== 解剖学レイアウト適用 ===');

                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeインスタンスが見つかりません');
                        return;
                  }

                  // 色分けを適用
                  applyAnatomyColors();

                  // 形状レイアウトを適用
                  createAnatomyShapeLayout();

                  // レイアウト適用後にフィット
                  setTimeout(function () {
                        cy.fit(cy.nodes(), 50); // 50pxのパディング
                  }, 100);
            }

            // 初期化開始
            setDefaultBackgroundColor();
            initializeAnatomyColors();

            // ドラッグ機能の実装
            function makeDraggable() {
                  const panel = document.getElementById('draggable-search-panel');
                  if (!panel) return;

                  let isDragging = false;
                  let currentX;
                  let currentY;
                  let initialX;
                  let initialY;
                  let xOffset = 0;
                  let yOffset = 0;

                  // 初期位置を設定
                  const rect = panel.getBoundingClientRect();
                  xOffset = rect.left;
                  yOffset = rect.top;

                  // マウスイベント
                  panel.addEventListener('mousedown', dragStart);
                  document.addEventListener('mousemove', drag);
                  document.addEventListener('mouseup', dragEnd);

                  // タッチイベント（スマホ対応）
                  panel.addEventListener('touchstart', dragStart, { passive: false });
                  document.addEventListener('touchmove', drag, { passive: false });
                  document.addEventListener('touchend', dragEnd);

                  function dragStart(e) {
                        // 入力フィールドやボタンをクリック/タッチした場合はドラッグしない
                        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') {
                              return;
                        }
                        
                        // 検索結果リストやリストアイテムをタッチした場合はドラッグしない（スクロール可能にする）
                        if (e.target.classList.contains('search-results') || 
                            e.target.classList.contains('list-group') ||
                            e.target.classList.contains('list-group-item') ||
                            e.target.closest('.search-results') ||
                            e.target.closest('.list-group-item')) {
                              return;
                        }

                        // タッチイベントとマウスイベントの両方に対応
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                        initialX = clientX - xOffset;
                        initialY = clientY - yOffset;

                        if (e.target === panel || panel.contains(e.target)) {
                              isDragging = true;
                              panel.style.cursor = 'grabbing';

                              // タッチイベントの場合、デフォルト動作を防ぐ
                              if (e.touches) {
                                    e.preventDefault();
                              }
                        }
                  }

                  function drag(e) {
                        if (isDragging) {
                              e.preventDefault();

                              // タッチイベントとマウスイベントの両方に対応
                              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                              const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                              currentX = clientX - initialX;
                              currentY = clientY - initialY;

                              xOffset = currentX;
                              yOffset = currentY;

                              // 画面境界内に制限（スマホ対応）
                              const maxX = window.innerWidth - panel.offsetWidth;
                              const maxY = window.innerHeight - panel.offsetHeight;

                              currentX = Math.max(0, Math.min(currentX, maxX));
                              currentY = Math.max(0, Math.min(currentY, maxY));

                              panel.style.left = currentX + 'px';
                              panel.style.top = currentY + 'px';
                              panel.style.position = 'fixed';
                        }
                  }

                  function dragEnd(e) {
                        if (isDragging) {
                              initialX = currentX;
                              initialY = currentY;
                              isDragging = false;
                              panel.style.cursor = 'move';
                        }
                  }

                  console.log('検索パネルがドラッグ可能になりました');
            }

            // ページ読み込み後にドラッグ機能を初期化
            document.addEventListener('DOMContentLoaded', function () {
                  setTimeout(makeDraggable, 1000); // AngularJSの初期化を待つ
            });

            // 検索パネルの表示/非表示を切り替える関数
            function toggleSearchPanel() {
                  const searchPanel = document.getElementById('draggable-search-panel');
                  const floatingBtn = document.getElementById('floating-search-btn');
                  
                  if (searchPanel.style.display === 'none') {
                        // 検索パネルを表示
                        searchPanel.style.display = 'block';
                        floatingBtn.style.display = 'none';
                        console.log('検索パネルを表示しました');
                  } else {
                        // 検索パネルを非表示
                        searchPanel.style.display = 'none';
                        floatingBtn.style.display = 'flex';
                        console.log('検索パネルを非表示にしました');
                  }
            }

            // フローティング隣接構造ボタンの表示/非表示を更新する関数
            function updateFloatingNeighborsButton() {
                  const neighborsPanel = document.getElementById('neighbors-panel');
                  const floatingBtn = document.getElementById('floating-neighbors-btn');
                  
                  if (!floatingBtn) {
                        console.log('フローティング隣接構造ボタンが見つかりません');
                        return;
                  }
                  
                  try {
                        const scope = angular.element(document.body).scope();
                        const isPanelHidden = neighborsPanel && neighborsPanel.style.display === 'none';
                        const hasNeighborsData = (scope && scope.selectedNodeNeighbors && scope.selectedNodeNeighbors.length > 0) || 
                                               (currentSelectedNodeNeighbors && currentSelectedNodeNeighbors.length > 0);
                        
                        // パネルが非表示で、隣接データがある場合にボタンを表示
                        if (isPanelHidden && hasNeighborsData) {
                              floatingBtn.style.display = 'flex';
                              console.log('フローティング隣接構造ボタンを表示');
                        } else {
                              floatingBtn.style.display = 'none';
                              console.log('フローティング隣接構造ボタンを非表示');
                        }
                  } catch (e) {
                        console.error('フローティングボタン更新エラー:', e);
                        floatingBtn.style.display = 'none';
                  }
            }

            // 隣接ノードパネルの表示/非表示を切り替える関数
            function toggleNeighborsPanel() {
                  console.log('=== 隣接ノードパネル切り替え ===');
                  
                  const neighborsPanel = document.getElementById('neighbors-panel');
                  
                  if (!neighborsPanel) {
                        console.error('隣接ノードパネルが見つかりません');
                        return;
                  }
                  
                  try {
                        const scope = angular.element(document.body).scope();
                        if (!scope) {
                              console.error('AngularJSスコープが見つかりません');
                              return;
                        }
                        
                        // 現在の表示状態を確認
                        const isCurrentlyHidden = neighborsPanel.style.display === 'none';
                        console.log('現在の状態:', isCurrentlyHidden ? '非表示' : '表示');
                        console.log('隣接ノード数:', scope.selectedNodeNeighbors ? scope.selectedNodeNeighbors.length : 0);
                        
                        if (isCurrentlyHidden) {
                              // パネルを表示する場合
                              if (scope.selectedNodeNeighbors && scope.selectedNodeNeighbors.length > 0) {
                                    // 隣接ノードデータがある場合は表示
                                    neighborsPanel.style.display = 'block';
                                    console.log('隣接ノードパネルを表示しました（データあり）');
                              } else {
                                    // 隣接ノードデータがない場合は、保存されたデータまたは最後に選択されたノードから再取得
                                    console.log('隣接ノードデータがないため、再取得を試みます');
                                    
                                    let neighborsList = [];
                                    
                                    // まず保存されたデータを確認
                                    if (currentSelectedNodeNeighbors && currentSelectedNodeNeighbors.length > 0) {
                                          console.log('保存された隣接ノードデータを使用:', currentSelectedNodeNeighbors.length, '件');
                                          neighborsList = currentSelectedNodeNeighbors;
                                    } else if (currentSelectedNode) {
                                          // 保存されたノードから隣接ノードを再取得
                                          console.log('保存されたノードから隣接ノードを再取得:', currentSelectedNode.data('name'));
                                          
                                          const neighbors = currentSelectedNode.neighborhood().nodes();
                                          neighbors.forEach(function (neighbor) {
                                                const neighborType = getNodeType(neighbor);
                                                neighborsList.push({
                                                      id: neighbor.id(),
                                                      name: neighbor.data('name') || neighbor.data('shared_name'),
                                                      type: neighbor.data('P2attr') || neighbor.data('P1attr') || 'unknown',
                                                      anatomyType: neighborType,
                                                      selected: false
                                                });
                                          });
                                    } else {
                                          // 最後の手段: 現在選択されているノードから取得
                                          const cy = window.cy;
                                          if (cy) {
                                                const selectedNodes = cy.nodes(':selected');
                                                if (selectedNodes.length > 0) {
                                                      const selectedNode = selectedNodes[0];
                                                      console.log('現在選択されたノードから隣接ノードを再取得:', selectedNode.data('name'));
                                                      
                                                      const neighbors = selectedNode.neighborhood().nodes();
                                                      neighbors.forEach(function (neighbor) {
                                                            const neighborType = getNodeType(neighbor);
                                                            neighborsList.push({
                                                                  id: neighbor.id(),
                                                                  name: neighbor.data('name') || neighbor.data('shared_name'),
                                                                  type: neighbor.data('P2attr') || neighbor.data('P1attr') || 'unknown',
                                                                  anatomyType: neighborType,
                                                                  selected: false
                                                            });
                                                      });
                                                } else {
                                                      console.log('選択されたノードがありません');
                                                }
                                          }
                                    }
                                    
                                    if (neighborsList.length > 0) {
                                          // スコープを更新
                                          scope.$apply(function () {
                                                scope.selectedNodeNeighbors = neighborsList;
                                          });
                                          
                                          neighborsPanel.style.display = 'block';
                                          console.log('隣接ノードパネルを表示しました:', neighborsList.length, '件');
                                    } else {
                                          console.log('表示する隣接ノードが見つかりませんでした');
                                    }
                              }
                        } else {
                              // パネルを非表示にする場合
                              neighborsPanel.style.display = 'none';
                              console.log('隣接ノードパネルを非表示にしました');
                              
                              // 注意: selectedNodeNeighborsはクリアしない（再表示時に使用するため）
                        }
                        
                        // フローティングボタンの表示/非表示を更新
                        updateFloatingNeighborsButton();
                  } catch (e) {
                        console.error('隣接ノードパネル切り替えエラー:', e);
                        
                        // フォールバック: 単純な表示切り替え
                        if (neighborsPanel.style.display === 'none') {
                              neighborsPanel.style.display = 'block';
                              console.log('フォールバック: パネルを表示');
                        } else {
                              neighborsPanel.style.display = 'none';
                              console.log('フォールバック: パネルを非表示');
                        }
                        
                        // フローティングボタンの表示/非表示を更新
                        updateFloatingNeighborsButton();
                  }
            }

            // デバッグ用：検索結果選択のテスト関数
            function testSearchSelection() {
                  console.log('=== 検索選択テスト開始 ===');
                  
                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeインスタンスが見つかりません');
                        return;
                  }
                  
                  // 最初のノードを取得してテスト
                  const firstNode = cy.nodes()[0];
                  if (firstNode) {
                        const nodeId = firstNode.id();
                        const nodeName = firstNode.data('name') || firstNode.data('shared_name');
                        console.log('テスト用ノード:', { id: nodeId, name: nodeName });
                        
                        // 直接highlightSelectedNodeを呼び出し
                        highlightSelectedNode(nodeId, nodeName);
                  } else {
                        console.error('テスト用ノードが見つかりません');
                  }
            }

            // スマホ対応の検索結果クリック処理
            function handleSearchResultClick(element) {
                  console.log('=== スマホ対応クリック処理 ===');
                  
                  // タッチイベントの重複を防ぐ
                  if (element.dataset.clicking) {
                        console.log('重複クリック防止');
                        return;
                  }
                  
                  element.dataset.clicking = 'true';
                  setTimeout(() => {
                        delete element.dataset.clicking;
                  }, 1000);

                  // データ属性から情報を取得
                  const resultId = element.getAttribute('data-result-id');
                  const resultName = element.getAttribute('data-result-name');
                  const resultIndex = element.getAttribute('data-result-index');

                  console.log('クリック要素:', element);
                  console.log('取得データ:', { resultId, resultName, resultIndex });

                  if (!resultId || !resultName) {
                        console.error('無効なデータ:', { resultId, resultName, resultIndex });
                        return;
                  }

                  // 視覚的フィードバック
                  element.style.backgroundColor = '#e3f2fd';
                  setTimeout(() => {
                        element.style.backgroundColor = '';
                  }, 200);

                  // Cytoscapeインスタンスの確認
                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeインスタンスが見つかりません');
                        return;
                  }

                  // ノードの存在確認
                  const targetNode = cy.getElementById(resultId);
                  if (!targetNode || targetNode.length === 0) {
                        console.error('ノードが見つかりません:', resultId);
                        return;
                  }

                  console.log('✅ ノード確認OK:', targetNode.data());

                  // 検索結果の選択状態を更新
                  try {
                        const allItems = document.querySelectorAll('.list-group-item');
                        allItems.forEach(item => item.classList.remove('selected-item'));
                        element.classList.add('selected-item');
                        console.log('✅ 選択状態更新完了');
                  } catch (e) {
                        console.error('❌ 選択状態更新エラー:', e);
                  }

                  // ノードをハイライト
                  console.log('🔄 ノードハイライト開始...');
                  highlightSelectedNode(resultId, resultName);
            }

            // 検索結果選択の問題を修正する関数（後方互換性）
            function fixedSelectSearchResult(resultId, resultName, resultIndex) {
                  console.log('=== 後方互換性関数 ===');
                  
                  if (!resultId || !resultName) {
                        console.error('無効なパラメータ:', { resultId, resultName, resultIndex });
                        return;
                  }

                  console.log('highlightSelectedNode実行中...');
                  highlightSelectedNode(resultId, resultName);
            }

            // グローバル関数として公開
            window.applyAnatomyLayout = applyAnatomyLayout;
            window.highlightSelectedNode = highlightSelectedNode;
            window.selectNeighborNode = selectNeighborNode;
            window.directSearch = directSearch;
            window.directClear = directClear;
            window.debugAortaNode = debugAortaNode;
            window.debugUlnarNode = debugUlnarNode;
            window.debugProblematicNodes = debugProblematicNodes;
            window.makeDraggable = makeDraggable;

            // 個別問題ノードテスト関数
            function testSpecificProblematicNode(nodeName) {
                  console.log(`=== ${nodeName} の個別テスト ===`);
                  
                  const cy = window.cy;
                  if (!cy) {
                        console.error('Cytoscapeが見つかりません');
                        return;
                  }

                  // ノードを検索
                  let foundNode = null;
                  cy.nodes().forEach(function(node) {
                        const name = (node.data('name') || '').toLowerCase();
                        const sharedName = (node.data('shared_name') || '').toLowerCase();
                        
                        if (name.includes(nodeName.toLowerCase()) || sharedName.includes(nodeName.toLowerCase())) {
                              foundNode = node;
                              return false; // 最初に見つかったものを使用
                        }
                  });

                  if (foundNode) {
                        console.log('ノード発見:', foundNode.data('name'));
                        console.log('隣接ノード数:', foundNode.neighborhood().nodes().length);
                        highlightSelectedNode(foundNode.id(), foundNode.data('name'));
                  } else {
                        console.error('ノードが見つかりません:', nodeName);
                  }
            }
            
            window.testSpecificProblematicNode = testSpecificProblematicNode;
            window.handleSearchResultClick = handleSearchResultClick;
            window.toggleSearchPanel = toggleSearchPanel;
            window.toggleNeighborsPanel = toggleNeighborsPanel;
            window.restoreNeighborsPanel = restoreNeighborsPanel;
            window.updateFloatingNeighborsButton = updateFloatingNeighborsButton;
            window.testSearchSelection = testSearchSelection;
            window.fixedSelectSearchResult = fixedSelectSearchResult;

            // デバッグ用: AngularJSスコープの確認
            window.debugAngular = function () {
                  console.log('=== AngularJS デバッグ ===');
                  const bodyScope = angular.element(document.body).scope();
                  const networkScope = angular.element('#network').scope();
                  const mainScope = angular.element('[ng-controller="MainCtrl"]').scope();

                  console.log('Body scope:', bodyScope);
                  console.log('Network scope:', networkScope);
                  console.log('MainCtrl scope:', mainScope);

                  if (mainScope) {
                        console.log('MainCtrl functions:');
                        console.log('- selectNeighborFromList:', typeof mainScope.selectNeighborFromList);
                        console.log('- testNeighborClick:', typeof mainScope.testNeighborClick);
                        console.log('- selectedNodeNeighbors:', mainScope.selectedNodeNeighbors);
                  }

                  return { bodyScope, networkScope, mainScope };
            };

            // 直接neighbor選択関数（グローバル）
            window.directSelectNeighbor = function (neighborId, neighborName, neighborIndex) {
                  console.log('=== 直接neighbor選択 ===');
                  console.log('受信パラメータ:');
                  console.log('- ID:', neighborId, '(型:', typeof neighborId, ')');
                  console.log('- Name:', neighborName, '(型:', typeof neighborName, ')');
                  console.log('- Index:', neighborIndex, '(型:', typeof neighborIndex, ')');

                  if (!neighborId) {
                        console.error('neighborIdが無効です:', neighborId);
                        return;
                  }

                  if (!neighborName) {
                        console.error('neighborNameが無効です:', neighborName);
                        return;
                  }

                  // 選択状態の視覚的更新
                  const neighborItems = document.querySelectorAll('.neighbors-panel .list-group-item');
                  neighborItems.forEach(function (item, index) {
                        item.classList.remove('selected-item');
                        if (index == neighborIndex) {
                              item.classList.add('selected-item');
                        }
                  });

                  console.log('neighborを新しい中心として設定:', neighborName);

                  // highlightSelectedNode関数を呼び出し
                  if (typeof window.highlightSelectedNode === 'function') {
                        setTimeout(function () {
                              console.log('highlightSelectedNode実行中...');
                              window.highlightSelectedNode(neighborId, neighborName);
                              console.log('highlightSelectedNode完了');
                        }, 100);
                  } else {
                        console.error('highlightSelectedNode関数が見つかりません');
                  }
            };

            // neighborパネルの手動更新関数
            window.updateNeighborsPanel = function (neighborsList) {
                  console.log('=== neighborパネル手動更新 ===');
                  console.log('neighbors数:', neighborsList.length);

                  const panel = document.querySelector('.neighbors-panel');
                  const ul = panel.querySelector('.list-group');

                  if (!ul) {
                        console.error('neighbor list要素が見つかりません');
                        return;
                  }

                  // 既存のneighborアイテムをクリア（ボタンは残す）
                  const existingItems = ul.querySelectorAll('.list-group-item');
                  existingItems.forEach(item => item.remove());

                  // 新しいneighborアイテムを追加
                  neighborsList.forEach(function (neighbor, index) {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        li.style.cursor = 'pointer';
                        li.setAttribute('data-neighbor-id', neighbor.id);
                        li.setAttribute('data-neighbor-name', neighbor.name);
                        li.setAttribute('data-neighbor-index', index);

                        li.innerHTML = `
                        ${neighbor.name} <span class="badge ${neighbor.anatomyType || neighbor.type}">${neighbor.anatomyType || neighbor.type}</span>
                    `;

                        // クリックイベントを追加
                        li.onclick = function () {
                              window.directSelectNeighbor(neighbor.id, neighbor.name, index);
                        };

                        ul.appendChild(li);
                  });

                  // パネルを表示
                  panel.style.display = neighborsList.length > 0 ? 'block' : 'none';

                  console.log('neighborパネル更新完了');
            };
      </script>
